<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Chat IA</title>
    <link rel="stylesheet" href="../css/splash.css">
</head>
<body>
<div id="palco">
    <div id="topo">
        <div id="brilho"></div>

                <circle class="ponto" cx="74" cy="61" r="4.5" fill="#6366f1"/>
            </svg>
        </div>
    </div>
    <h1 id="nome">Chat IA</h1>
    <p id="slogan">Converse. Pesquise. Aprenda.</p>
    <div id="barra"><div id="preenchimento"></div></div>
</div>

<!-- a ordem importa: primeiro o GSAP, depois a animação que o usa -->
<script src="../js/gsap.min.js"></script>
<script src="../js/splash.js"></script>

</html>
